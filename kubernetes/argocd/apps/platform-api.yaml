apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jztlee/secure-platform-identity.git
    targetRevision: main
    path: kubernetes/base/platform-api
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

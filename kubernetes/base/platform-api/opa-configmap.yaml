apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy
  namespace: platform-api
data:
  authz.rego: |
    package platform.authz

    default allow = false

    allow if {
    	input.action == "read"
    	role_matches(input.subject_id, "read-only")
    }

    allow if {
    	input.action == "read"
    	role_matches(input.subject_id, "developer")
    }

    allow if {
    	input.action in ["read", "write"]
    	role_matches(input.subject_id, "admin")
    }

    role_matches(subject, role) if {
    	subject_roles[subject][_] == role
    }

    subject_roles := {
    	"user:lee": ["admin"],
    	"user:dev-test": ["developer"],
    }